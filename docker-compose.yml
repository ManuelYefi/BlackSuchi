services:
  mysql:
    image: mysql:8.4
    container_name: blacksushi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: blacksushi
      MYSQL_DATABASE: blacksushi
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pblacksushi"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
